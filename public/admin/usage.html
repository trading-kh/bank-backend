<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura Bank · Usage Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Noto Sans Khmer', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  
  .container {
    max-width: 1400px;
    margin: 0 auto;
  }
  
  .header {
    background: white;
    padding: 24px 32px;
    border-radius: 16px;
    margin-bottom: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    color: #667eea;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .header .meta {
    color: #666;
    font-size: 14px;
    padding: 8px 16px;
    background: #f0f4ff;
    border-radius: 8px;
  }
  
  .refresh-btn {
    padding: 10px 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: all 0.3s;
    box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
  }
  
  .refresh-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
  }
  
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 24px;
    margin-bottom: 24px;
  }
  
  .card {
    background: white;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  
  .card h2 {
    font-size: 20px;
    font-weight: 600;
    color: #667eea;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  
  .stat-box {
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    border-radius: 12px;
    text-align: center;
    transition: transform 0.2s;
  }
  
  .stat-box:hover {
    transform: scale(1.05);
  }
  
  .stat-value {
    font-size: 28px;
    font-weight: 700;
    color: #667eea;
    margin-bottom: 4px;
  }
  
  .stat-label {
    font-size: 13px;
    color: #666;
    font-weight: 500;
  }
  
  .progress-bar {
    width: 100%;
    height: 30px;
    background: #e0e0e0;
    border-radius: 15px;
    overflow: hidden;
    margin: 16px 0;
    position: relative;
  }
  
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
    transition: width 0.5s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 600;
    font-size: 14px;
  }
  
  .progress-fill.warning {
    background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
  }
  
  .progress-fill.danger {
    background: linear-gradient(90deg, #fa709a 0%, #fee140 100%);
  }
  
  .table-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  
  .table-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: #f9fafb;
    border-radius: 8px;
    border-left: 4px solid #667eea;
  }
  
  .table-name {
    font-weight: 600;
    color: #333;
  }
  
  .table-size {
    color: #667eea;
    font-weight: 600;
  }
  
  .chart-container {
    position: relative;
    height: 300px;
    margin-top: 16px;
  }
  
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: #999;
  }
  
  .loading-icon {
    font-size: 48px;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
  }
  
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  
  @media (max-width: 768px) {
    .grid {
      grid-template-columns: 1fr;
    }
    .stat-row {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📊 Usage Dashboard</h1>
    <div style="display: flex; gap: 12px; align-items: center;">
      <div class="meta" id="lastUpdate">កំពុងផ្ទុក...</div>
      <button class="refresh-btn" onclick="loadUsage()">🔄 ផ្ទុកឡើងវិញ</button>
    </div>
  </div>

  <div id="content">
    <div class="loading">
      <div class="loading-icon">⏳</div>
      <div>កំពុងផ្ទុកទិន្នន័យ...</div>
    </div>
  </div>
</div>

<script>
const API = '/admin/api';
const params = new URLSearchParams(window.location.search);
let token = params.get('token');

if (!token) {
  try {
    token = localStorage.getItem('aura_admin_token');
  } catch (e) {}
}

if (!token) {
  alert('❌ ខ្វះ token');
  window.location.href = '/admin/login.html';
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
      'Authorization': 'Bearer ' + token,
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let json = null;
  try { json = await res.json(); } catch (_) {}
  if (!res.ok) {
    if (res.status === 401) {
      alert('Session expired');
      window.location.href = '/admin/login.html';
    }
    throw new Error(json?.error || `HTTP ${res.status}`);
  }
  return json?.data;
}

    'cards': '💳 កាត',
    'transactions': '💸 ប្រតិបត្តិការ',
    'goals': '🎯 គោលដៅសន្សំ',
    'loans': '🏦 កម្ចី',
    'loan_schedules': '📅 កាលវិភាគសង',
    'loan_payments': '💰 ការសងកម្ចី',
    'external_transfers': '🔄 ផ្ទេរក្រៅប្រព័ន្ធ',
    'notifications': '🔔 សេចក្តីសារ',

    'provinces': '🗺️ ខេត្ត/ក្រុង',
    'districts': '🏘️ ស្រុក/ខណ្ឌ',
    'communes': '🏘️ ឃុំ/សង្កាត់',

  return nameMap[name] || name;
}

let charts = {};

async function loadUsage() {
  try {
    const data = await api('/usage');
    renderDashboard(data);
    document.getElementById('lastUpdate').textContent = 
      `ធ្វើបច្ចុប្បន្នភាពចុងក្រោយ: ${new Date().toLocaleTimeString('km-KH')}`;
  } catch (error) {
    console.error('Load error:', error);
    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="loading">
          <div style="font-size: 48px; margin-bottom: 16px;">❌</div>
          <div>មិនអាចផ្ទុកទិន្នន័យ: ${error.message}</div>
        </div>
      </div>
    `;
  }
}

        <div class="chart-container">
          <canvas id="cmdChart"></canvas>
        </div>
      </div>

      <div class="card">
        <h2>📈 សកម្មភាព 7 ថ្ងៃចុងក្រោយ</h2>
        <div class="chart-container">
          <canvas id="activityChart"></canvas>
        </div>

}

function renderCmdChart(cmdStats) {
  const ctx = document.getElementById('cmdChart');
  if (!ctx) return;
  
  if (charts.cmd) charts.cmd.destroy();
  
  const labels = cmdStats.map(c => c.command_type);
  const completed = cmdStats.map(c => c.completed);
  const failed = cmdStats.map(c => c.failed);
  const pending = cmdStats.map(c => c.pending);
  
  charts.cmd = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{
        data: cmdStats.map(c => c.count),
        backgroundColor: [
          '#667eea', '#764ba2', '#f093fb', '#f5576c', '#fa709a',
          '#fee140', '#30cfd0', '#330867'
        ],
        borderWidth: 2,
        borderColor: '#fff',
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'right',
          labels: {
            font: {
              family: 'Noto Sans Khmer',
              size: 12,
            },
            padding: 12,
          }
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              const stat = cmdStats[context.dataIndex];
              return [
                `សរុប: ${stat.count}`,
                `✅ ជោគជ័យ: ${stat.completed}`,
                `❌ បរាជ័យ: ${stat.failed}`,
                `⏳ កំពុងរង់ចាំ: ${stat.pending}`,
              ];
            }
          }
        }
      }
    }
  });
}

function renderActivityChart(activity) {
  const ctx = document.getElementById('activityChart');
  if (!ctx) return;
  
  if (charts.activity) charts.activity.destroy();
  
  const labels = activity.map(a => {
    const d = new Date(a.date);
    return `${d.getDate()}/${d.getMonth() + 1}`;
  });
  const data = activity.map(a => a.commands);
  
  charts.activity = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Commands',
        data: data,
        borderColor: '#667eea',
        backgroundColor: 'rgba(102, 126, 234, 0.1)',
        borderWidth: 3,
        fill: true,
        tension: 0.4,
        pointRadius: 5,
        pointHoverRadius: 7,
        pointBackgroundColor: '#667eea',
        pointBorderColor: '#fff',
        pointBorderWidth: 2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: false,
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              return `${context.parsed.y} commands`;
            }
          }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: {
            stepSize: 1,
            font: {
              family: 'Noto Sans Khmer',
            }
          },
          grid: {
            color: 'rgba(0, 0, 0, 0.05)',
          }
        },
        x: {
          ticks: {
            font: {
              family: 'Noto Sans Khmer',
            }
          },
          grid: {
            display: false,
          }
        }
      }
    }
  });
}

let dmRecords = [];
let dmSelectedIds = new Set();

async function searchRecords() {
  const type = document.getElementById('dmType').value;
  const limit = document.getElementById('dmLimit').value;
  const btn = document.getElementById('dmSearchBtn');
  
  btn.disabled = true;
  btn.textContent = '⏳ កំពុងស្វែងរក...';
  
  try {
    const params = new URLSearchParams({ limit });
    if (type) params.set('type', type);
    
    const data = await api('/data-manager?' + params.toString());
    dmRecords = data.records || [];
    dmSelectedIds.clear();
    
    document.getElementById('dmResults').style.display = 'block';
    document.getElementById('dmDeleteResult').style.display = 'none';
    renderDmTable();
    updateDmSelection();
  } catch (error) {
    alert('❌ កំហុស: ' + error.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 ស្វែងរក';
  }
}

function renderDmTable() {
  const tbody = document.getElementById('dmTableBody');
  
  if (dmRecords.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="padding: 40px; text-align: center; color: #999;">
      <div style="font-size: 36px; margin-bottom: 8px;">📭</div>
      គ្មានទិន្នន័យ
    </td></tr>`;
    return;
  }
  
  tbody.innerHTML = dmRecords.map((rec, i) => {
    const checked = dmSelectedIds.has(`${rec.type}:${rec.id}`) ? 'checked' : '';
    const meta = buildMetaString(rec);
    const dateStr = rec.date ? new Date(rec.date).toLocaleString('km-KH', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    }) : '—';
    
    return `<tr style="background: ${i % 2 === 0 ? '#fff' : '#f9fafb'}; border-bottom: 1px solid #eee; transition: background 0.2s;" 
                onmouseover="this.style.background='#e8eaf6'" onmouseout="this.style.background='${i % 2 === 0 ? '#fff' : '#f9fafb'}'">
      <td style="padding: 10px 8px; text-align: center;">
        <input type="checkbox" class="dm-row-check" data-type="${rec.type}" data-id="${rec.id}" 
               ${checked} onchange="toggleRow(this)" style="width: 16px; height: 16px; cursor: pointer;" />
      </td>
      <td style="padding: 10px 8px;">${formatTableName(rec.type)}</td>
      <td style="padding: 10px 8px; white-space: nowrap;">${dateStr}</td>
      <td style="padding: 10px 8px; text-align: right; font-weight: 600; color: #667eea;">${rec.size_pretty}</td>
      <td style="padding: 10px 8px; color: #666; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${meta}</td>
    </tr>`;
  }).join('');
}

function buildMetaString(rec) {
  const m = rec.metadata || {};
  const parts = [];
  if (m.command_type) parts.push(`cmd: ${m.command_type}`);
  if (m.status) parts.push(`status: ${m.status}`);
  if (m.user_id) parts.push(`user: #${m.user_id}`);
  if (m.admin_email) parts.push(m.admin_email);
  if (m.action) parts.push(`action: ${m.action}`);
  if (m.target_type) parts.push(m.target_type);
  if (m.title) parts.push(m.title);
  if (m.category) parts.push(m.category);
  if (m.amount != null) parts.push(`$${m.amount}`);
  return parts.join(' · ') || '—';
}

function toggleRow(checkbox) {
  const key = `${checkbox.dataset.type}:${checkbox.dataset.id}`;
  if (checkbox.checked) {
    dmSelectedIds.add(key);
  } else {
    dmSelectedIds.delete(key);
  }
  updateDmSelection();
}

function toggleSelectAll(checked) {
  document.querySelectorAll('.dm-row-check').forEach(cb => {
    cb.checked = checked;
    const key = `${cb.dataset.type}:${cb.dataset.id}`;
    if (checked) dmSelectedIds.add(key);
    else dmSelectedIds.delete(key);
  });
  updateDmSelection();
}

function updateDmSelection() {
  const count = dmSelectedIds.size;
  document.getElementById('dmSelectedCount').textContent = count > 0 ? `បានជ្រើស ${count}` : '';
  document.getElementById('dmDeleteCount').textContent = count;
  document.getElementById('dmDeleteBtn').disabled = count === 0;
  
  let totalBytes = 0;
  dmRecords.forEach(rec => {
    if (dmSelectedIds.has(`${rec.type}:${rec.id}`)) {
      totalBytes += rec.size_bytes || 0;
    }
  });
  document.getElementById('dmTotalSize').textContent = count > 0 
    ? `ទំហំដែលបានជ្រើស: ${formatBytes(totalBytes)}` 
    : `សរុប: ${dmRecords.length} records · ${formatBytes(dmRecords.reduce((s, r) => s + (r.size_bytes || 0), 0))}`;
}

function formatBytes(bytes) {
  if (bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

async function deleteSelected() {
  if (dmSelectedIds.size === 0) return;
  
  const records = Array.from(dmSelectedIds).map(key => {
    const [type, id] = key.split(':');
    return { type, id: parseInt(id) };
  });
  
  if (!confirm(`⚠️ តើអ្នកប្រាកដទេថាចង់លុប ${records.length} records?\n\nសកម្មភាពនេះមិនអាចត្រឡប់វិញបានទេ!`)) {
    return;
  }
  
  const resultDiv = document.getElementById('dmDeleteResult');
  resultDiv.style.display = 'block';
  resultDiv.innerHTML = '<div style="padding: 16px; text-align: center; color: #667eea;">⏳ កំពុងលុប...</div>';
  
  try {
    const data = await api('/data-manager/delete', {
      method: 'POST',
      body: { records }
    });
    
    let html = '<div style="background: #e8f5e9; padding: 16px; border-radius: 8px; border-left: 4px solid #4caf50;">';
    html += '<h3 style="color: #2e7d32; margin-bottom: 12px;">✅ បានលុបដោយជោគជ័យ!</h3>';
    html += '<ul style="list-style: none; padding: 0;">';
    for (const [type, info] of Object.entries(data.results)) {
      html += `<li style="padding: 6px 0;">${formatTableName(type)}: បានលុប <strong>${info.count}</strong> records</li>`;
    }
    html += '</ul>';
    html += `<p style="margin-top: 12px; color: #2e7d32; font-weight: 600;">`;
    html += `🎉 សរុប: បានលុប ${data.deleted} records · បានរំដោះ ${data.freed_pretty}</p>`;
    html += '</div>';
    
    resultDiv.innerHTML = html;
    
    dmSelectedIds.clear();
    document.getElementById('dmSelectAll').checked = false;
    await searchRecords();
    setTimeout(() => loadUsage(), 500);
  } catch (error) {
    resultDiv.innerHTML = `<div style="background: #ffebee; padding: 16px; border-radius: 8px; border-left: 4px solid #f44336; color: #c62828;">❌ កំហុស: ${error.message}</div>`;
  }
}

loadUsage();
</script>
