<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura Bank · គ្រប់គ្រងឧបករណ៍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Noto Sans Khmer', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  
  .container {
    max-width: 1400px;
    margin: 0 auto;
  }
  
  /* Header */
  .header {
    background: white;
    padding: 24px 32px;
    border-radius: 16px;
    margin-bottom: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    color: #667eea;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .header .meta {
    color: #666;
    font-size: 14px;
    padding: 8px 16px;
    background: #f0f4ff;
    border-radius: 8px;
  }
  
  /* Tabs */
  .tabs {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  
  .tab-btn {
    padding: 14px 28px;
    border: none;
    background: white;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
    transition: all 0.3s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .tab-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  
  .tab-btn.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
  }
  
  /* Content */
  .tab-content {
    display: none;
    background: white;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    animation: fadeIn 0.3s;
  }
  
  .tab-content.active {
    display: block;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  
  .stat-card {
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    border-radius: 12px;
    text-align: center;
    transition: transform 0.2s;
  }
  
  .stat-card:hover {
    transform: scale(1.05);
  }
  
  .stat-value {
    font-size: 32px;
    font-weight: 700;
    color: #667eea;
    margin-bottom: 4px;
  }
  
  .stat-label {
    font-size: 13px;
    color: #666;
    font-weight: 500;
  }
  
  /* Search */
  .search-box {
    width: 100%;
    padding: 14px 20px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    margin-bottom: 20px;
    font-size: 15px;
    font-family: inherit;
    transition: all 0.3s;
  }
  
  .search-box:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }
  
  /* Table */
  .data-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  
  .data-table thead {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
  }
  
  .data-table th {
    padding: 16px;
    text-align: left;
    font-weight: 600;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  .data-table td {
    padding: 16px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  
  .data-table tr:last-child td {
    border-bottom: none;
  }
  
  .data-table tbody tr {
    transition: background 0.2s;
  }
  
  .data-table tbody tr:hover {
    background: #f9fafb;
  }
  
  /* SMS Cards */
  .sms-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  
  .sms-card {
    padding: 20px;
    background: white;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    transition: all 0.3s;
  }
  
  .sms-card:hover {
    border-color: #667eea;
    box-shadow: 0 4px 16px rgba(102, 126, 234, 0.15);
    transform: translateY(-2px);
  }
  
  .sms-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid #f0f0f0;
  }
  
  .sms-header strong {
    font-size: 16px;
    color: #333;
  }
  
  .sms-header small {
    color: #999;
    font-size: 13px;
  }
  
  .sms-meta {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  
  .pill {
    padding: 4px 12px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  
  .pill.inbox {
    background: #dbeafe;
    color: #1e40af;
  }
  
  .pill.sent {
    background: #dcfce7;
    color: #166534;
  }
  
  .pill.read {
    background: #f3f4f6;
    color: #6b7280;
  }
  
  .pill.unread {
    background: #fef3c7;
    color: #92400e;
  }
  
  .sms-body {
    color: #555;
    line-height: 1.6;
    white-space: pre-wrap;
    margin-top: 8px;
    padding: 12px;
    background: #f9fafb;
    border-radius: 8px;
  }
  
  /* Empty State */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #999;
  }
  
  .empty-icon {
    font-size: 64px;
    margin-bottom: 16px;
    opacity: 0.3;
  }
  
  .empty-text {
    font-size: 16px;
    line-height: 1.6;
  }
  
  /* Map Container */
  #map {
    width: 100%;
    height: 500px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    z-index: 1;
  }
  
  /* Map Toggle Button */
  .map-toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 1000;
    background: white;
    border: 2px solid #667eea;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    color: #667eea;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .map-toggle:hover {
    background: #667eea;
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
  }
  
  .map-toggle.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-color: transparent;
  }
  
  .map-wrapper {
    position: relative;
  }
  
  /* Marker Animation */
  @keyframes markerBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
  
  @keyframes markerPulse {
    0% {
      box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7);
    }
    70% {
      box-shadow: 0 0 0 20px rgba(102, 126, 234, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(102, 126, 234, 0);
    }
  }
  
  .leaflet-marker-icon {
    animation: markerBounce 1s ease-in-out;
    transition: all 0.3s ease;
  }
  
  .leaflet-marker-icon:hover {
    transform: scale(1.2);
  }
  
  .pulse-marker {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #667eea;
    border: 3px solid white;
    box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7);
    animation: markerPulse 2s infinite;
  }
  
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  
  /* Location Details */
  .location-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  
  .location-item {
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
    border-radius: 12px;
    border-left: 4px solid #667eea;
  }
  
  .location-label {
    font-size: 12px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    font-weight: 600;
  }
  
  .location-value {
    font-size: 18px;
    font-weight: 600;
    color: #333;
  }
  
  /* Responsive */
  @media (max-width: 768px) {
    body { padding: 12px; }
    .header { flex-direction: column; gap: 12px; padding: 20px; }
    .header h1 { font-size: 22px; }
    .tab-content { padding: 20px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .data-table { font-size: 13px; }
    .data-table th, .data-table td { padding: 12px 8px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📱 គ្រប់គ្រងឧបករណ៍</h1>
    <div class="meta" id="pageMeta">កំពុងផ្ទុក...</div>
  </div>

  <div class="tabs">
    <button class="tab-btn" data-tab="location">📍 ទីតាំង</button>
    <button class="tab-btn" data-tab="photos">🖼️ Photos</button>
    <button class="tab-btn" data-tab="contacts">👥 Contacts</button>
    <button class="tab-btn" data-tab="sms">💬 SMS</button>
  </div>

  <div id="location-tab" class="tab-content">
    <div class="map-wrapper">
      <div id="map"></div>
      <button id="mapToggle" class="map-toggle" onclick="toggleMapView()">
        <span id="toggleIcon">🛰️</span>
        <span id="toggleText">Satellite</span>
      </button>
      <button id="refreshLocation" class="map-toggle" style="right: 160px;" onclick="refreshLocation()">
        <span>🔄</span>
        <span>ផ្ទុកឡើងវិញ</span>
      </button>
      <button id="openGoogleMaps" class="map-toggle" style="right: 320px; background: #4285F4; color: white; border-color: #4285F4;" onclick="openInGoogleMaps()">
        <span>🗺️</span>
        <span>Google Maps</span>
      </button>
    </div>
    <div class="stats" id="locationStats"></div>
    <div id="locationContent"></div>
  </div>

  <div id="photos-tab" class="tab-content">
    <div class="stats" id="photosStats"></div>
    <div id="photosContent"></div>
  </div>

  <div id="contacts-tab" class="tab-content">
    <input type="search" class="search-box" id="contactSearch" placeholder="🔍 ស្វែងរក contact តាមឈ្មោះ លេខទូរស័ព្ទ ឬ email...">
    <div class="stats" id="contactStats"></div>
    <div id="contactsContent"></div>
  </div>

  <div id="sms-tab" class="tab-content">
    <input type="search" class="search-box" id="smsSearch" placeholder="🔍 ស្វែងរក SMS តាមលេខទូរស័ព្ទ ឬ nội dung...">
    <div class="stats" id="smsStats"></div>
    <div id="smsContent"></div>
  </div>
</div>

<script>
const API = '/admin/api';
const params = new URLSearchParams(window.location.search);
let token = params.get('token');
let userId = params.get('user_id');
let targetTab = params.get('tab') || 'location'; // Default to location tab
let commandData = {};
let map = null;
let standardLayer = null;
let satelliteLayer = null;
let isSatelliteView = false;

if (!userId || !token) {
  alert('❌ ខ្វះ user ID ឬ token');
  window.close();
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
      'Authorization': 'Bearer ' + token,
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let json = null;
  try { json = await res.json(); } catch (_) {}
  if (!res.ok) {
    if (res.status === 401) {
      alert('Session expired. សូមបិទ window នេះហើយព្យាយាមម្តងទៀត។');
      window.close();
    }
    throw new Error(json?.error || `HTTP ${res.status}`);
  }
  return json?.data;
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function dt(d) {
  if (!d) return '—';
  // Android DATE_ADDED is in seconds, JS Date expects milliseconds
  const timestamp = d > 10000000000 ? d : d * 1000;
  return new Date(timestamp).toLocaleString('km-KH', { 
    year: 'numeric', 
    month: 'short', 
    day: 'numeric', 
    hour: '2-digit', 
    minute: '2-digit' 
  });
}

function showModal(title, content) {
  const modal = document.createElement('div');
  modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 10000; padding: 20px;';
  
  const modalContent = document.createElement('div');
  modalContent.style.cssText = 'background: white; border-radius: 16px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 32px; position: relative;';
  
  const header = document.createElement('div');
  header.style.cssText = 'display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid #f0f0f0;';
  
  const titleEl = document.createElement('h2');
  titleEl.textContent = title;
  titleEl.style.cssText = 'margin: 0; color: #667eea; font-size: 24px;';
  
  const closeBtn = document.createElement('button');
  closeBtn.textContent = '✕';
  closeBtn.style.cssText = 'background: none; border: none; font-size: 28px; cursor: pointer; color: #999; padding: 0; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: all 0.3s;';
  closeBtn.onmouseover = () => { closeBtn.style.background = '#f0f0f0'; closeBtn.style.color = '#333'; };
  closeBtn.onmouseout = () => { closeBtn.style.background = 'none'; closeBtn.style.color = '#999'; };
  closeBtn.onclick = () => document.body.removeChild(modal);
  
  header.appendChild(titleEl);
  header.appendChild(closeBtn);
  
  const body = document.createElement('div');
  body.innerHTML = content;
  
  modalContent.appendChild(header);
  modalContent.appendChild(body);
  modal.appendChild(modalContent);
  
  modal.onclick = (e) => { if (e.target === modal) document.body.removeChild(modal); };
  document.body.appendChild(modal);
}

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab + '-tab').classList.add('active');
  };
});

// Load data
async function loadData() {
  try {
    const commands = await api(`/device/commands?user_id=${userId}&limit=200`);
    
    const locationCmd = commands.find(c => c.command_type === 'get_location' && c.result_data);
    const photosCmd = commands.find(c => c.command_type === 'get_photos' && c.result_data);
    const contactsCmd = commands.find(c => c.command_type === 'get_contacts' && c.result_data);
    const smsCmd = commands.find(c => c.command_type === 'get_sms' && c.result_data);
    
    commandData = {
      location: locationCmd?.result_data,
      photos: photosCmd?.result_data,
      contacts: contactsCmd?.result_data,
      sms: smsCmd?.result_data,
    };
    
    document.getElementById('pageMeta').textContent = `User ID: ${userId}`;
    
    // Render each tab with its own error handling
    try {
      renderLocation();
    } catch (err) {
      console.error('renderLocation error:', err);
    }
    
    try {
      renderPhotos();
    } catch (err) {
      console.error('renderPhotos error:', err);
    }
    
    try {
      renderContacts();
    } catch (err) {
      console.error('renderContacts error:', err);
    }
    
    try {
      renderSMS();
    } catch (err) {
      console.error('renderSMS error:', err);
    }
    
    // Activate the target tab
    activateTab(targetTab);
    
  } catch (error) {
    console.error('Load error:', error);
    alert('❌ មិនអាចផ្ទុកទិន្នន័យ: ' + error.message);
  }
}

function activateTab(tabName) {
  const tabBtn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
  if (tabBtn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tabBtn.classList.add('active');
    document.getElementById(tabName + '-tab').classList.add('active');
  }
}

function renderLocation() {
  const data = commandData.location;
  
  // Check if map container exists
  const mapContainer = document.getElementById('map');
  if (!mapContainer) {
    console.error('Map container not found');
    return;
  }
  
  // Initialize map
  try {
    map = L.map('map').setView([11.5564, 104.9282], 13); // Default: Phnom Penh
  } catch (err) {
    console.error('Map initialization error:', err);
    return;
  }
  
  // Standard map layer
  standardLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
  });
  
  // Satellite map layer (Esri World Imagery)
  satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles © Esri',
    maxZoom: 19,
  });
  
  // Add standard layer by default
  standardLayer.addTo(map);
  
  if (!data) {
    document.getElementById('locationStats').innerHTML = '';
    document.getElementById('locationContent').innerHTML = `
      <div class="empty">
        <div class="empty-icon">📍</div>
        <div class="empty-text">មិនមានទិន្នន័យទីតាំង<br>សូមចុច 📍 Location ក្នុង admin panel ដើម្បីទាញយក</div>
      </div>
    `;
    return;
  }
  
  // Validate coordinates before using them
  const lat = parseFloat(data.lat);
  const lng = parseFloat(data.lng);
  const hasValidCoords = !isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
  
  // Add marker with popup and animation
  if (hasValidCoords) {
    const pulseIcon = L.divIcon({
      className: 'pulse-marker-wrapper',
      html: '<div class="pulse-marker"></div>',
      iconSize: [20, 20],
      iconAnchor: [10, 10],
    });
    
    const marker = L.marker([lat, lng], {
      icon: pulseIcon,
      animation: true,
    }).addTo(map);
    
    const popupContent = `
      <div style="font-family:'Noto Sans Khmer',sans-serif;min-width:200px">
        <strong style="color:#667eea;font-size:14px">📍 ទីតាំងឧបករណ៍</strong><br>
        <div style="margin-top:8px;font-size:12px;line-height:1.6">
          ${data.village ? `<div>ភូមិ: <strong>${esc(data.village)}</strong></div>` : ''}
          ${data.commune ? `<div>ឃុំ/សង្កាត់: <strong>${esc(data.commune)}</strong></div>` : ''}
          ${data.district ? `<div>ស្រុក/ខណ្ឌ: <strong>${esc(data.district)}</strong></div>` : ''}
          ${data.province ? `<div>ខេត្ត/ក្រុង: <strong>${esc(data.province)}</strong></div>` : ''}
          ${data.country ? `<div>ប្រទេស: <strong>${esc(data.country)}</strong></div>` : ''}
          <div style="margin-top:8px;color:#666;font-size:11px">
            Lat: ${lat.toFixed(6)} | Lng: ${lng.toFixed(6)}<br>
            Accuracy: ${data.accuracy || '—'}m
          </div>
        </div>
      </div>
    `;
    
    marker.bindPopup(popupContent).openPopup();
    
    // Smooth fly to location with animation
    try {
      map.flyTo([lat, lng], 16, {
        duration: 1.5,
        easeLinearity: 0.5,
      });
    } catch (err) {
      console.error('flyTo error:', err);
    }
  } else {
    console.warn('Invalid location coordinates:', data.lat, data.lng);
  }

function applyPhotoDateFilter() {
  const dateFrom = document.getElementById('photoDateFrom').value;
  const dateTo = document.getElementById('photoDateTo').value;
  
  if (!dateFrom && !dateTo) {
    alert('សូមជ្រើសរើសយ៉ាងហោចណាស់កាលបរិច្ឆេទមួយ');
    return;
  }
  
  const photos = commandData.photos?.photos || [];
  const filtered = photos.filter(p => {
    const photoDate = new Date(p.date > 10000000000 ? p.date : p.date * 1000);
    const photoDateStr = photoDate.toISOString().split('T')[0];
    
    if (dateFrom && photoDateStr < dateFrom) return false;
    if (dateTo && photoDateStr > dateTo) return false;
    return true;
  });
  
  renderFilteredPhotos(filtered, dateFrom, dateTo);
}

function clearPhotoDateFilter() {
  document.getElementById('photoDateFrom').value = '';

function downloadSinglePhoto(photoId) {
  const photo = commandData.photos?.photos?.find(p => p.id === photoId);
  if (!photo || !photo.thumbnail) {
    alert('មិនមានរូបភាពសម្រាប់ download');
    return;
  }
  
  const link = document.createElement('a');
  link.href = `data:image/jpeg;base64,${photo.thumbnail}`;
  link.download = photo.name || `photo_${photo.id}.jpg`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function downloadAllPhotos() {
  const photos = commandData.photos?.photos || [];
  if (photos.length === 0) {
    alert('មិនមានរូបភាពសម្រាប់ download');
    return;
  }
  
  if (!confirm(`ទាញយករូបភាព ${photos.length} សន្លឹក?`)) return;
  
  let downloaded = 0;
  const total = photos.length;
  
  photos.forEach((photo, index) => {
    if (!photo.thumbnail) return;
    
    setTimeout(() => {
      const link = document.createElement('a');
      link.href = `data:image/jpeg;base64,${photo.thumbnail}`;
      link.download = photo.name || `photo_${photo.id}.jpg`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      downloaded++;
      if (downloaded === total) {
        alert(`✅ បានទាញយករូបភាព ${downloaded} សន្លឹករួចរាល់!`);
      }
    }, index * 300); // Delay 300ms between each download to avoid browser blocking
  });
}

function toggleMapView() {
  if (!map || !standardLayer || !satelliteLayer) return;
  
  const toggleBtn = document.getElementById('mapToggle');
  const toggleIcon = document.getElementById('toggleIcon');
  const toggleText = document.getElementById('toggleText');
  
  if (isSatelliteView) {
    // Switch to standard view
    map.removeLayer(satelliteLayer);
    standardLayer.addTo(map);
    isSatelliteView = false;
    toggleIcon.textContent = '🛰️';
    toggleText.textContent = 'Satellite';
    toggleBtn.classList.remove('active');
  } else {
    // Switch to satellite view
    map.removeLayer(standardLayer);
    satelliteLayer.addTo(map);
    isSatelliteView = true;
    toggleIcon.textContent = '🗺️';
    toggleText.textContent = 'Map';
    toggleBtn.classList.add('active');
  }
}

async function refreshLocation() {
  const btn = document.getElementById('refreshLocation');
  const originalHTML = btn.innerHTML;
  
  // Show loading state
  btn.innerHTML = '<span style="animation: spin 1s linear infinite">⏳</span> <span>កំពុងផ្ទុក...</span>';
  btn.disabled = true;
  btn.style.opacity = '0.6';
  
  try {
    // Fetch latest location data
    const commands = await api(`/device/commands?user_id=${userId}&limit=200`);
    const locationCmd = commands.find(c => c.command_type === 'get_location' && c.result_data);
    
    if (locationCmd?.result_data) {
      commandData.location = locationCmd.result_data;
      
      // Clear existing map and re-render with animation
      if (map) {
        map.remove();
      }
      renderLocation();
      
      // Success feedback
      btn.innerHTML = '<span>✅</span> <span>ជោគជ័យ!</span>';
      setTimeout(() => {
        btn.innerHTML = originalHTML;
        btn.disabled = false;
        btn.style.opacity = '1';
      }, 1500);
    } else {
      throw new Error('មិនមានទិន្នន័យទីតាំង');
    }
  } catch (error) {
    console.error('Refresh error:', error);
    btn.innerHTML = '<span>❌</span> <span>បរាជ័យ</span>';
    setTimeout(() => {
      btn.innerHTML = originalHTML;
      btn.disabled = false;
      btn.style.opacity = '1';
    }, 2000);
  }
}

function openInGoogleMaps() {
  const data = commandData.location;
  
  if (!data || !data.lat || !data.lng) {
    alert('❌ មិនមានទិន្នន័យទីតាំង\nសូមចុច 🔄 ផ្ទុកឡើងវិញ ឬ 📍 Location ក្នុង admin panel');
    return;
  }
  
  // Use geo intent for Android (opens Google Maps app if installed)
  // Fallback to web URL for desktop/other devices
  const isAndroid = /Android/i.test(navigator.userAgent);
  const lat = data.lat.toFixed(6);
  const lng = data.lng.toFixed(6);
  
  let url;
  if (isAndroid) {
    // Android geo intent - opens in Google Maps app
    url = `geo:${lat},${lng}?z=18`;
  } else {
    // Web URL - opens in browser
    url = `https://www.google.com/maps?q=${lat},${lng}&z=18`;
  }
  
  window.open(url, '_blank');
}

    <div class="stat-card">
      <div class="stat-value">${messages.filter(m => !m.read).length}</div>
      <div class="stat-label">🔴 មិនទាន់អាន</div>
    </div>
  `;
  
  if (messages.length === 0) {
    document.getElementById('smsContent').innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">រកមិនឃើញ SMS ដែលត្រូវនឹងការស្វែងរក</div>
      </div>
    `;
    return;
  }
  
  document.getElementById('smsContent').innerHTML = `
    <div class="sms-list">
      ${messages.map(m => `
        <div class="sms-card">
          <div class="sms-header">
            <strong>📱 ${esc(m.address || 'Unknown')}</strong>
            <small>🕐 ${dt(m.date)}</small>
          </div>
          <div class="sms-meta">
            <span class="pill ${m.type || 'unknown'}">${m.type === 'inbox' ? '📥' : m.type === 'sent' ? '📤' : '📨'} ${esc(m.type || 'unknown')}</span>
            ${m.read ? '<span class="pill read">✓ អាន</span>' : '<span class="pill unread">● ថ្មី</span>'}
          </div>
          <div class="sms-body">${esc(m.body || '')}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// Search handlers
document.getElementById('contactSearch').oninput = (e) => renderContacts(e.target.value);
document.getElementById('smsSearch').oninput = (e) => renderSMS(e.target.value);

// Load data on page load
loadData();
</script>

</body>
</html>
