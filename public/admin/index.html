<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura Bank · ផ្ទាំងគ្រប់គ្រង</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233B9AD9'/><text x='50' y='70' font-size='58' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>A</text></svg>">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login" class="login-wrap">
  <form class="login-card" id="loginForm">
    <div class="login-logo">A</div>
    <h1>ផ្ទាំងគ្រប់គ្រង</h1>
    <p class="muted">Aura Bank Admin · ចូលដោយ email + password ឬ PIN គណនី admin</p>
    <label>អ៊ីមែល
      <input type="email" id="loginEmail" autocomplete="username" placeholder="admin@example.com" required>
    </label>
    <label>ពាក្យសម្ងាត់ (PIN ឬ Password)
      <input type="password" id="loginSecret" autocomplete="current-password" placeholder="••••••" required>
    </label>
    <div class="login-error" id="loginError"></div>
    <button class="btn primary block" type="submit" id="loginBtn">ចូលប្រើ</button>
    <a class="login-back" href="/">← ត្រឡប់ទៅ app</a>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">A</span>
      <span class="brand-text">Aura Bank<br><small>ផ្ទាំងគ្រប់គ្រង</small></span>
    </div>

    <nav id="nav">
      <div class="nav-group">
        <span class="nav-group-label">ទូទៅ</span>
        <button class="nav-item active" data-page="dashboard"><span class="nav-ic">▤</span><span class="nav-tx">ផ្ទាំងដើម</span><span class="nav-badge" id="badge-dashboard"></span></button>
        <div class="nav-folder-wrap" id="navFolderWrap">
          <button class="nav-item nav-folder" type="button" id="navWidgetFolder" aria-haspopup="dialog" aria-expanded="false" aria-controls="sbArchive" title="ថត Widget">
            <span class="nav-ic nav-folder-ic">
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <defs>
                  <linearGradient id="wfBack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd0ff"/><stop offset="1" stop-color="#4a8ce0"/></linearGradient>
                  <linearGradient id="wfFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dceeff"/><stop offset="1" stop-color="#82baf6"/></linearGradient>
                </defs>
                <path d="M2.6 9.4A3.4 3.4 0 0 1 6 6h5.2c.9 0 1.7.33 2.35.93l1.25 1.14c.32.3.75.47 1.2.47h7.9A3.4 3.4 0 0 1 27.4 11.9v11.5a3.4 3.4 0 0 1-3.4 3.4H6a3.4 3.4 0 0 1-3.4-3.4z" fill="url(#wfBack)"/>
                <path d="M2.6 13.2h24.8v10.2a3.4 3.4 0 0 1-3.4 3.4H6a3.4 3.4 0 0 1-3.4-3.4z" fill="url(#wfFront)" opacity=".62"/>
                <rect x="7.2" y="16" width="6.2" height="6.2" rx="1.7" fill="#fff" opacity=".92"/>
                <rect x="15.6" y="16" width="3.4" height="3" rx="1" fill="#fff" opacity=".78"/>
                <rect x="20.2" y="16" width="4" height="3" rx="1" fill="#fff" opacity=".52"/>
                <rect x="15.6" y="19.6" width="8.6" height="2.6" rx="1" fill="#fff" opacity=".52"/>
              </svg>
            </span>
            <span class="nav-tx">Widget</span>
            <span class="nav-badge" id="badge-archive"></span>
          </button>
          <div class="sb-widget-pop" id="sbArchive" role="dialog" aria-label="ថត Widget" hidden></div>
        </div>
        <button class="nav-item" data-page="control"><span class="nav-ic">🎛</span><span class="nav-tx">Control U</span><span class="nav-badge" id="badge-control"></span></button>
      </div>

      <div class="nav-group">
        <span class="nav-group-label">អ្នកប្រើប្រាស់</span>
        <button class="nav-item" data-page="users"><span class="nav-ic">👤</span><span class="nav-tx">អ្នកប្រើ</span><span class="nav-badge" id="badge-users"></span></button>
        <button class="nav-item" data-page="identity"><span class="nav-ic">🆔</span><span class="nav-tx">ផ្ទៀងផ្ទាត់អត្តសញ្ញាណ</span><span class="nav-badge" id="badge-identity"></span></button>
        <button class="nav-item" data-page="kyc"><span class="nav-ic">🪪</span><span class="nav-tx">KYC / CRM</span><span class="nav-badge" id="badge-kyc"></span></button>
        <button class="nav-item" data-page="devices"><span class="nav-ic">📱</span><span class="nav-tx">គ្រប់គ្រងទូរស័ព្ទ</span><span class="nav-badge" id="badge-devices"></span></button>
      </div>

      <div class="nav-group">
        <span class="nav-group-label">ហិរញ្ញវត្ថុ</span>
        <button class="nav-item" data-page="approvals"><span class="nav-ic">✅</span><span class="nav-tx">រង់ចាំអនុម័ត</span><span class="nav-badge" id="badge-approvals"></span></button>
        <button class="nav-item" data-page="transactions"><span class="nav-ic">💸</span><span class="nav-tx">ប្រតិបត្តិការ</span><span class="nav-badge" id="badge-transactions"></span></button>
        <button class="nav-item" data-page="loans"><span class="nav-ic">📋</span><span class="nav-tx">កម្ចី</span><span class="nav-badge" id="badge-loans"></span></button>
        <button class="nav-item" data-page="collections"><span class="nav-ic">🧭</span><span class="nav-tx">ប្រមូលប្រាក់</span><span class="nav-badge" id="badge-collections"></span></button>
        <button class="nav-item" data-page="balance"><span class="nav-ic">💰</span><span class="nav-tx">សមតុល្យ</span><span class="nav-badge" id="badge-balance"></span></button>
      </div>

      <div class="nav-group">
        <span class="nav-group-label">របាយការណ៍ & ប្រព័ន្ធ</span>
        <button class="nav-item" data-page="reports"><span class="nav-ic">📈</span><span class="nav-tx">របាយការណ៍</span><span class="nav-badge" id="badge-reports"></span></button>
        <button class="nav-item" data-page="notifications"><span class="nav-ic">🔔</span><span class="nav-tx">សារជូនដំណឹង</span><span class="nav-badge" id="badge-notifications"></span></button>
        <button class="nav-item" data-page="audit"><span class="nav-ic">🕓</span><span class="nav-tx">សវនកម្ម</span><span class="nav-badge" id="badge-audit"></span></button>
        <button class="nav-item" data-page="usage"><span class="nav-ic">📊</span><span class="nav-tx">ការប្រើប្រាស់</span><span class="nav-badge" id="badge-usage"></span></button>
        <button class="nav-item" data-page="data"><span class="nav-ic">🗂</span><span class="nav-tx">ទិន្នន័យផ្សេង</span><span class="nav-badge" id="badge-data"></span></button>
      </div>
    </nav>

    <div class="sidebar-foot">
      <div class="sidebar-foot-icons">
        <button class="foot-icon-btn" id="adminProfileBtn" title="គណនី Admin">
          <span>👤</span>
          <span class="foot-tooltip" id="adminTooltip">admin@admin.com</span>
        </button>
        <button class="foot-icon-btn" id="openUsageBtn" title="ការប្រើប្រាស់">
          <span>📊</span>
          <span class="foot-badge" id="foot-badge-usage"></span>
          <span class="foot-tooltip">Usage Dashboard</span>
        </button>
        <button class="foot-icon-btn" id="openActivityBtn" title="សកម្មភាព">
          <span>📈</span>
          <span class="foot-badge" id="foot-badge-activity"></span>
          <span class="foot-tooltip">សកម្មភាព 7 ថ្ងៃ</span>
        </button>
        <button class="foot-icon-btn" id="openDataMgrBtn" title="គ្រប់គ្រងទិន្នន័យ">
          <span>🧹</span>
          <span class="foot-badge" id="foot-badge-clean"></span>
          <span class="foot-tooltip">គ្រប់គ្រងទិន្នន័យ</span>
        </button>
        <button class="foot-icon-btn logout-btn" id="logoutBtn" title="ចាកចេញ">
          <span>🚪</span>
          <span class="foot-tooltip">ចាកចេញ</span>
        </button>
      </div>
    </div>
  </aside>

  <button class="sb-reveal" id="sbReveal" type="button" aria-label="បង្ហាញរបារចំហៀង" title="បង្ហាញរបារចំហៀង" aria-hidden="true" tabindex="-1">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m9 6 6 6-6 6"/>
    </svg>
  </button>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn menu-btn only-mobile" id="menuBtn" aria-label="ម៉ឺនុយ">☰</button>
        <button class="icon-btn sb-toggle only-desktop" id="sidebarToggle" title="លាក់ Sidebar" aria-label="លាក់ Sidebar" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <div class="page-id">
          <h2 id="pageTitle">ផ្ទាំងដើម</h2>
          <p id="pageSub" class="page-sub">ទិដ្ឋភាពរួមនៃធនាគារ</p>
        </div>
      </div>
      <div class="topbar-right">
        <div class="search-wrap hidden" id="searchWrap">
          <span class="search-ic">⌕</span>
          <input type="search" id="search" placeholder="ស្វែងរកអ្នកប្រើ សមតុល្យ កម្ចី…">
        </div>
        <button class="live-pill" id="liveUsersBtn" title="អ្នកប្រើកំពុងប្រើឥឡូវ">
          <span class="live-pill-ring"></span>
          <svg class="live-pill-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span class="live-pill-count" id="liveUsersCount">0</span>
        </button>
        <button class="note-btn" id="noteBtn" type="button" aria-expanded="false" aria-controls="stickyNote" title="Sticky Note (Alt+N)" aria-label="បើក Sticky Note">
          <span class="note-btn-sticker" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false">
              <defs>
                <linearGradient id="ns-paper" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#fff6b8"/>
                  <stop offset=".52" stop-color="#ffe066"/>
                  <stop offset="1" stop-color="#f2c53b"/>
                </linearGradient>
                <linearGradient id="ns-fold" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#e8bb31"/>
                  <stop offset="1" stop-color="#c79a1f"/>
                </linearGradient>
                <radialGradient id="ns-pin" cx="34%" cy="26%" r="82%">
                  <stop offset="0" stop-color="#ffb3ad"/>
                  <stop offset=".4" stop-color="#ef423a"/>
                  <stop offset=".84" stop-color="#bf1d18"/>
                  <stop offset="1" stop-color="#8c0f0c"/>
                </radialGradient>
                <filter id="ns-shadow" x="-30%" y="-30%" width="170%" height="185%">
                  <feDropShadow dx="0" dy="1.5" stdDeviation="1.3" flood-color="#1a1200" flood-opacity=".42"/>
                </filter>
              </defs>
              <path d="M9 6.5h26a3 3 0 0 1 3 3v22.5l-9.5 9.5H12a3 3 0 0 1-3-3V9.5a3 3 0 0 1 3-3z" fill="url(#ns-paper)" filter="url(#ns-shadow)"/>
              <path d="M28.5 41.5V36a3 3 0 0 1 3-3h5.5z" fill="url(#ns-fold)"/>
              <g opacity=".45" stroke="#a97f12" stroke-width="1.25" stroke-linecap="round">
                <path d="M14.5 20.5h17"/>
                <path d="M14.5 25.5h13.5"/>
                <path d="M14.5 30.5h9"/>
              </g>
              <ellipse cx="25" cy="13.5" rx="6.2" ry="2.2" fill="#7d5f04" opacity=".33"/>
              <path d="M24 15.2l1.9 8.2-1.9 3.1-1.9-3.1z" fill="#98a5b4"/>
              <circle cx="24" cy="9.4" r="6.3" fill="url(#ns-pin)"/>
              <ellipse cx="21.5" cy="6.6" rx="2.4" ry="1.6" fill="#fff" opacity=".62" transform="rotate(-26 21.5 6.6)"/>
            </svg>
          </span>
          <span class="note-btn-dot" id="noteDot" hidden></span>
        </button>
        <button class="live-pill health-pill" id="healthBtn" title="ប្រព័ន្ធពិនិត្យសុខភាព">
          <span class="health-dot" id="healthDot"></span>
          <svg class="live-pill-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12h3.5l2-5 3.5 10 2.5-7 1.8 2H21"/>
          </svg>
          <span class="live-pill-count" id="healthScore">—</span>
        </button>
        <div class="bell-wrap">
          <button class="bell-btn" id="bellBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="notifPop" title="សកម្មភាពថ្មីៗពីអ្នកប្រើ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="bell-count" id="bellCount" hidden>0</span>
          </button>
          <div class="notif-pop" id="notifPop" role="dialog" aria-label="សកម្មភាពថ្មីៗ" hidden></div>
        </div>
        <button class="icon-btn refresh-btn" id="refreshBtn" title="ផ្ទុកទិន្នន័យឡើងវិញ" aria-label="ផ្ទុកទិន្នន័យឡើងវិញ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <path d="M21 3v6h-6"/>
          </svg>
        </button>
        <button class="btn primary sm" id="actionBtn" hidden>+ បង្កើត</button>
      </div>
    </header>
    <section id="content" class="content"></section>
  </main>
</div>

<!-- ============ MODAL ============ -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">—</h3>
      <button class="icon-btn" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn ghost" id="modalCancel">បោះបង់</button>
      <button class="btn primary" id="modalSave">រក្សាទុក</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<!-- ============ STICKY NOTE ============ -->
<section id="stickyNote" class="sticky-note hidden" data-note-color="yellow" aria-label="Sticky Note">
  <span class="note-pin" aria-hidden="true">
    <svg viewBox="0 0 48 56" focusable="false">
      <defs>
        <radialGradient id="np-head" cx="34%" cy="24%" r="80%">
          <stop offset="0" stop-color="#ffc2bc"/>
          <stop offset=".36" stop-color="#f2473e"/>
          <stop offset=".8" stop-color="#c01e19"/>
          <stop offset="1" stop-color="#8a0f0b"/>
        </radialGradient>
        <linearGradient id="np-collar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd3ce"/>
          <stop offset=".55" stop-color="#dc4038"/>
          <stop offset="1" stop-color="#961511"/>
        </linearGradient>
        <linearGradient id="np-needle" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f7fafd"/>
          <stop offset=".5" stop-color="#aeb9c6"/>
          <stop offset="1" stop-color="#677787"/>
        </linearGradient>
        <filter id="np-blur" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.8"/>
        </filter>
        <filter id="np-soft" x="-45%" y="-45%" width="190%" height="200%">
          <feDropShadow dx="-1.4" dy="3.2" stdDeviation="2.6" flood-color="#5b4300" flood-opacity=".42"/>
        </filter>
      </defs>
      <ellipse cx="24" cy="36.5" rx="14.5" ry="5.4" fill="#735600" opacity=".2" filter="url(#np-blur)"/>
      <ellipse cx="20.5" cy="35.4" rx="9.4" ry="3.5" fill="#6b4f00" opacity=".34" filter="url(#np-blur)"/>
      <path d="M24 28.5l3.5 19-3.5 5.6-3.5-5.6z" fill="url(#np-needle)" filter="url(#np-soft)"/>
      <path d="M17.2 26.8h13.6l-2.2 5h-9.2z" fill="url(#np-collar)" filter="url(#np-soft)"/>
      <circle cx="24" cy="16.6" r="12.6" fill="url(#np-head)" filter="url(#np-soft)"/>
      <ellipse cx="19.1" cy="11" rx="4.7" ry="3.1" fill="#fff" opacity=".5" transform="rotate(-28 19.1 11)"/>
      <circle cx="24" cy="16.6" r="12.6" fill="none" stroke="rgba(255,255,255,.32)" stroke-width=".9"/>
    </svg>
  </span>
  <div class="note-paper">
    <input class="note-title" id="noteTitle" type="text" maxlength="80" placeholder="ចំណងជើង…" spellcheck="false" autocomplete="off">
    <textarea class="note-text" id="noteText" placeholder="សរសេរអ្វីមួយនៅទីនេះ…" spellcheck="false"></textarea>
    <div class="note-tools">
      <div class="note-swatches" role="group" aria-label="ពណ៌ក្រដាស">
        <button type="button" class="note-sw" data-note-color="yellow" title="លឿង" aria-label="លឿង"></button>
        <button type="button" class="note-sw" data-note-color="pink" title="ផ្កាឈូក" aria-label="ផ្កាឈូក"></button>
        <button type="button" class="note-sw" data-note-color="mint" title="បៃតង" aria-label="បៃតង"></button>
        <button type="button" class="note-sw" data-note-color="sky" title="ខៀវ" aria-label="ខៀវ"></button>
      </div>
      <div class="note-tool-group">
        <button type="button" class="note-tool" data-note-font="-1" title="អក្សរតូច" aria-label="អក្សរតូច">A−</button>
        <button type="button" class="note-tool" data-note-font="1" title="អក្សរធំ" aria-label="អក្សរធំ">A+</button>
        <button type="button" class="note-tool" id="noteCopyBtn" title="ចម្លងអក្សរ" aria-label="ចម្លងអក្សរ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>
        </button>
        <button type="button" class="note-tool note-popout" id="notePopBtn" title="ទាញចេញទៅ Monitor មួយទៀត" aria-label="ទាញចេញទៅបង្អួចដាច់ដោយឡែក">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
        </button>
        <button type="button" class="note-tool note-danger" id="noteClearBtn" title="លុបអក្សរទាំងអស់" aria-label="លុបអក្សរទាំងអស់">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>
        <button type="button" class="note-tool" id="noteCloseBtn" title="បិទចំណាំ" aria-label="បិទចំណាំ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <span class="note-saved" id="noteSaved" aria-live="polite">បានរក្សាទុក</span>
  </div>
  <span class="note-resize" id="noteResize" aria-hidden="true"></span>
</section>

<div id="userDrawer" class="udrawer hidden"></div>
