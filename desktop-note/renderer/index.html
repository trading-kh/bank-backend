<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Aura Sticky Note</title>
<link rel="stylesheet" href="note.css">
</head>
<body>
<div class="stage">
  <span class="pin" aria-hidden="true">
    <svg viewBox="0 0 48 56">
      <defs>
        <radialGradient id="np-head" cx="34%" cy="24%" r="80%">
          <stop offset="0" stop-color="#ffc2bc"/>
          <stop offset=".36" stop-color="#f2473e"/>
          <stop offset=".8" stop-color="#c01e19"/>
          <stop offset="1" stop-color="#8a0f0b"/>
        </radialGradient>
        <linearGradient id="np-collar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd3ce"/>
          <stop offset=".55" stop-color="#dc4038"/>
          <stop offset="1" stop-color="#961511"/>
        </linearGradient>
        <linearGradient id="np-needle" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f7fafd"/>
          <stop offset=".5" stop-color="#aeb9c6"/>
          <stop offset="1" stop-color="#677787"/>
        </linearGradient>
        <filter id="np-blur" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.8"/>
        </filter>
        <filter id="np-soft" x="-45%" y="-45%" width="190%" height="200%">
          <feDropShadow dx="-1.4" dy="3.2" stdDeviation="2.6" flood-color="#5b4300" flood-opacity=".42"/>
        </filter>
      </defs>
      <ellipse cx="24" cy="36.5" rx="14.5" ry="5.4" fill="#735600" opacity=".2" filter="url(#np-blur)"/>
      <ellipse cx="20.5" cy="35.4" rx="9.4" ry="3.5" fill="#6b4f00" opacity=".34" filter="url(#np-blur)"/>
      <path d="M24 28.5l3.5 19-3.5 5.6-3.5-5.6z" fill="url(#np-needle)" filter="url(#np-soft)"/>
      <path d="M17.2 26.8h13.6l-2.2 5h-9.2z" fill="url(#np-collar)" filter="url(#np-soft)"/>
      <circle cx="24" cy="16.6" r="12.6" fill="url(#np-head)" filter="url(#np-soft)"/>
      <ellipse cx="19.1" cy="11" rx="4.7" ry="3.1" fill="#fff" opacity=".5" transform="rotate(-28 19.1 11)"/>
      <circle cx="24" cy="16.6" r="12.6" fill="none" stroke="rgba(255,255,255,.32)" stroke-width=".9"/>
    </svg>
  </span>

  <section class="paper" id="note" data-note-color="yellow">
    <input class="title" id="title" type="text" maxlength="80" placeholder="ចំណងជើង…" spellcheck="false" autocomplete="off">
    <textarea class="text" id="text" placeholder="សរសេរអ្វីមួយនៅទីនេះ…" spellcheck="false"></textarea>

    <div class="tools">
      <div class="swatches" role="group" aria-label="ពណ៌ក្រដាស">
        <button type="button" class="sw" data-color="yellow" title="លឿង"></button>
        <button type="button" class="sw" data-color="pink" title="ផ្កាឈូក"></button>
        <button type="button" class="sw" data-color="mint" title="បៃតង"></button>
        <button type="button" class="sw" data-color="sky" title="ខៀវ"></button>
      </div>
      <div class="group">
        <button type="button" class="tool" data-font="-1" title="អក្សរតូច">A−</button>
        <button type="button" class="tool" data-font="1" title="អក្សរធំ">A+</button>
        <button type="button" class="tool sync" id="syncBtn" title="ភ្ជាប់ / sync">
          <span class="dot" id="syncDot"></span>
          <span class="sync-label" id="syncLabel">local</span>
        </button>
        <button type="button" class="tool on" id="topBtn" title="នៅលើគេជានិច្ច">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2.6 3.2H6.4z"/></svg>
        </button>
        <button type="button" class="tool" id="hideBtn" title="បិទបណ្តោះអាសន្ន (Alt+N បើកវិញ)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <span class="saved" id="saved" aria-live="polite">បានរក្សាទុក</span>
    <span class="grip" id="grip" title="អូសដើម្បីប្តូរទំហំ" aria-hidden="true"></span>
  </section>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head">
        <h3>ភ្ជាប់ជាមួយ Aura Bank</h3>
        <button type="button" class="tool" id="sheetClose" title="បិទ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg>
        </button>
      </div>
      <p class="sheet-sub" id="sheetSub">ចំណាំនេះ sync ស្វ័យប្រវត្តិជាមួយផ្ទាំងគ្រប់គ្រង admin។</p>
      <label>ម៉ាស៊ីនមេ (Server)<input id="server" type="text" autocomplete="off" spellcheck="false"></label>
      <label>អ៊ីមែល<input id="email" type="email" autocomplete="username" spellcheck="false"></label>
      <label>ពាក្យសម្ងាត់<input id="password" type="password" autocomplete="current-password"></label>
      <button type="button" class="primary" id="connectBtn">ភ្ជាប់</button>
      <button type="button" class="link" id="logoutBtn" hidden>ផ្តាច់គណនី (ប្រើតែក្នុងម៉ាស៊ីន)</button>
      <p class="err" id="sheetErr"></p>
    </div>
  </div>
</div>
<script src="note.js"></script>
</body>
</html>
